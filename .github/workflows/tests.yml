name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
           
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
