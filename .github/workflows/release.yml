name: release

# Builds PhishLens.exe (no Python needed to run it) and attaches it to a GitHub Release.
# Trigger: push a tag such as v1.0.0, or run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build the executable
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name PhishLens --icon assets/phishlens.ico --add-data "phishlens/web;phishlens/web" --add-data "phishlens/samples;phishlens/samples" run_phishlens.py
      - name: Keep the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhishLens-windows
          path: dist/PhishLens.exe
      - name: Publish to the release page
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhishLens.exe
          generate_release_notes: true
