name: release

# Builds a portable Windows bundle: the official, signed Python from python.org plus PhishLens.
# Nothing is compiled, so there is no unsigned .exe for Windows (Smart App Control) to block.
# Trigger: push a tag such as v1.0.1, or run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build the portable bundle
        shell: pwsh
        run: |
          $py = "3.12.10"
          New-Item -ItemType Directory -Force -Path build/PhishLens | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile build/python-embed.zip
          Expand-Archive build/python-embed.zip -DestinationPath build/PhishLens/python
          Copy-Item phishlens build/PhishLens/python/phishlens -Recurse
          Get-ChildItem build/PhishLens -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item packaging/PhishLens.bat build/PhishLens/PhishLens.bat
          Copy-Item packaging/READ-ME-FIRST.txt build/PhishLens/READ-ME-FIRST.txt
          Copy-Item LICENSE build/PhishLens/LICENSE.txt
      - name: Check that the bundle really runs
        shell: pwsh
        run: |
          $out = & build/PhishLens/python/python.exe -m phishlens analyze build/PhishLens/python/phishlens/samples/sample_phish.eml --no-intel
          if (-not ($out -match "CRITICAL")) { throw "The bundle did not produce the expected report" }
          & build/PhishLens/python/python.exe -m phishlens --version
      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path build/PhishLens -DestinationPath PhishLens-windows.zip
      - name: Keep it as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhishLens-windows
          path: PhishLens-windows.zip
      - name: Publish to the release page
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhishLens-windows.zip
          generate_release_notes: true
